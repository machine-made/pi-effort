# Fails when cubic did not complete a review, or when CodeRabbit was off or errored.
# Passes with a warning when CodeRabbit is only rate limited.
# Reads check runs only. Check titles are matched as text: update them here
# when a vendor renames one.
name: review-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  checks: read
jobs:
  review-gate:
    # Dependabot and draft PRs: the job is skipped, which passes a required check.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for both bots, then decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Latest check run per bot app on this commit.
          q='[.check_runs[] | select(.app.slug=="coderabbitai" or .app.slug=="cubic-dev-ai")
              | {app: .app.slug, id, status, conclusion, title: .output.title}]
              | group_by(.app) | map(max_by(.id))'
          runs='[]'
          for i in $(seq 1 36); do                     # 36 x 30 s = 18 min
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq "$q")
            n_done=$(jq '[.[] | select(.status=="completed")] | length' <<<"$runs")
            [ "$n_done" -ge 2 ] && break
            sleep 30
          done
          echo "$runs" | jq .
          cr=$(jq -r '[.[]|select(.app=="coderabbitai" and .status=="completed")][0].title // "missing"' <<<"$runs")
          cu=$(jq -r '[.[]|select(.app=="cubic-dev-ai" and .status=="completed")][0].title // "missing"' <<<"$runs")
          case "$cu" in
            "AI review completed") ;;
            *) echo "::error::cubic did not complete a review: $cu"; exit 1 ;;
          esac
          case "$cr" in
            "Finished") ;;
            "Review rate limited") echo "::warning::CodeRabbit rate limited; cubic reviewed." ;;
            "Path filters excluded"*) echo "::notice::CodeRabbit: $cr" ;;
            *) echo "::error::CodeRabbit did not review: $cr"; exit 1 ;;
          esac
